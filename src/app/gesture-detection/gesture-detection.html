<div class="gesture-container">
  @if (isLoading()) {
    <div class="overlay">
      <div class="spinner"></div>
      <p>Iniciando cámara y cargando modelo...</p>
    </div>
  }

  @if (cameraError()) {
    <div class="overlay error">
      <p>{{ cameraError() }}</p>
    </div>
  }

  <div class="panel camera-panel">
    <video #cameraFeed class="camera-feed" autoplay muted playsinline></video>
    @if (!isLoading() && !cameraError()) {
      <div class="gesture-badge">{{ detectedGesture() }}</div>
    }
  </div>

  <div class="panel video-panel">
    @if (!cameraError()) {
      <app-video-player
        [src]="currentVideoSrc()"
        [loop]="isDefaultVideo()"
        (ended)="onGestureVideoEnded()"
      />
    }
  </div>
</div>
