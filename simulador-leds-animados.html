<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador POV - Animaciones LED</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 0.9em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .pattern-card {
            background: linear-gradient(135deg, #1a1f3a 0%, #16213e 100%);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(102, 126, 234, 0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .pattern-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.4);
            border-color: rgba(102, 126, 234, 0.6);
        }

        .pattern-header {
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            text-align: center;
        }

        .pattern-number {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .pattern-name {
            font-size: 1.4em;
            font-weight: bold;
            margin-top: 5px;
        }

        .canvas-container {
            background: #000;
            position: relative;
            overflow: hidden;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .pattern-description {
            padding: 15px;
            font-size: 0.9em;
            line-height: 1.6;
            color: #aaa;
            border-top: 1px solid rgba(102, 126, 234, 0.2);
        }

        .gesture-link {
            display: inline-block;
            margin-top: 10px;
            padding: 3px 8px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 4px;
            font-size: 0.8em;
            color: #667eea;
        }

        .info-box {
            background: rgba(102, 126, 234, 0.1);
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .rpm-display {
            text-align: center;
            margin-top: 20px;
            font-size: 1.1em;
            color: #667eea;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(102, 126, 234, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
        }

        .speed-control label {
            font-size: 0.9em;
        }

        .speed-control input {
            width: 200px;
        }

        .speed-value {
            min-width: 80px;
            text-align: right;
            color: #667eea;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .speed-control {
                flex-direction: column;
                align-items: stretch;
            }

            .speed-control input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Simulador POV - Animaciones LED</h1>
        <p class="subtitle">Visualización de los patrones animados que verá en el holograma a 1500 RPM</p>

        <div class="info-box">
            <strong>⚡ Motor:</strong> 1500 RPM | <strong>🎨 Patrones:</strong> 4 animaciones dinámicas sincronizadas
            <br>
            <small>Las animaciones están diseñadas para girar suavemente con la tira LED mientras el motor gira</small>
        </div>

        <div class="controls">
            <button onclick="toggleAnimation()">▶️ Reproducir / Pausar</button>
            <button onclick="resetAnimation()">🔄 Reiniciar</button>
            <div class="speed-control">
                <label for="speedSlider">Velocidad animación:</label>
                <input type="range" id="speedSlider" min="0.5" max="3" step="0.1" value="1" onchange="updateSpeed()">
                <span class="speed-value"><span id="speedValue">1.0</span>x</span>
            </div>
        </div>

        <div class="grid" id="patternGrid"></div>
    </div>

    <script>
        const PATTERNS = [
            {
                name: 'RAINBOW',
                number: 0,
                color: 'rainbow',
                description: '🌈 Arcoíris deslizante con efecto breathing. Los colores rotan suavemente mientras la tira gira.',
                gesture: 'Sin gesto (default)'
            },
            {
                name: 'RINGS',
                number: 1,
                color: 'rings',
                description: '🔵 Anillos concentricos cian que pulsean. El brillo aumenta y disminuye suavemente.',
                gesture: '🫴 Open Palm'
            },
            {
                name: 'SPOKES',
                number: 2,
                color: 'spokes',
                description: '🔴 Aspas rojas que rotan visiblemente. Crean un efecto de movimiento continuo.',
                gesture: '👎 Thumb Down'
            },
            {
                name: 'SPIRAL',
                number: 3,
                color: 'spiral',
                description: '🟣 Espiral violeta vibrant con colores que cambian dinámicamente. Efecto hipnotizante.',
                gesture: '☝️ Pointing Up'
            }
        ];

        let animationRunning = true;
        let speedMultiplier = 1;
        let animationPhase = 0;
        const NUM_LEDS = 97;
        const POV_SECTORS = 36;

        function init() {
            const grid = document.getElementById('patternGrid');
            PATTERNS.forEach(pattern => {
                const card = createPatternCard(pattern);
                grid.appendChild(card);
            });
            animate();
        }

        function createPatternCard(pattern) {
            const card = document.createElement('div');
            card.className = 'pattern-card';
            card.innerHTML = `
                <div class="pattern-header">
                    <div class="pattern-number">Patrón ${pattern.number}</div>
                    <div class="pattern-name">${pattern.name}</div>
                </div>
                <div class="canvas-container">
                    <canvas id="canvas-${pattern.number}" width="300" height="300"></canvas>
                </div>
                <div class="pattern-description">
                    ${pattern.description}
                    <div class="gesture-link">${pattern.gesture}</div>
                </div>
            `;
            return card;
        }

        function hslToRgb(h, s, l) {
            h = h % 360;
            s = s / 100;
            l = l / 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            };
            return [
                Math.round(f(0) * 255),
                Math.round(f(8) * 255),
                Math.round(f(4) * 255)
            ];
        }

        function drawRainbow(ctx, sector, phase) {
            const centerX = ctx.canvas.width / 2;
            const centerY = ctx.canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.8;
            const ledsPerArc = Math.PI * 2 / NUM_LEDS;

            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

            for (let i = 0; i < NUM_LEDS; i++) {
                const angle = (i * ledsPerArc) + (phase * 0.05);
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;

                const hue = (i * 360 / NUM_LEDS + phase) % 360;
                const [r, g, b] = hslToRgb(hue, 100, 50);

                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Dibujar círculo de referencia
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawRings(ctx, sector, phase) {
            const centerX = ctx.canvas.width / 2;
            const centerY = ctx.canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.8;
            const ledsPerArc = Math.PI * 2 / NUM_LEDS;

            // Pulsación
            const brightness = Math.sin(phase * 0.1) * 100 + 130;

            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

            // Dibujar anillos
            for (let i = 0; i < NUM_LEDS; i++) {
                const isRing = ((i * 8) / NUM_LEDS % 2) < 1;
                if (!isRing) continue;

                const angle = (i * ledsPerArc) + (phase * 0.02);
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;

                const r = 0;
                const g = Math.round(200 * brightness / 255);
                const b = Math.round(255 * brightness / 255);

                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Marcador blanco
            ctx.fillStyle = 'rgb(255, 255, 255)';
            ctx.beginPath();
            ctx.arc(centerX + radius, centerY, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(0, 200, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawSpokes(ctx, sector, phase) {
            const centerX = ctx.canvas.width / 2;
            const centerY = ctx.canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.8;

            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

            // Dibujar 6 aspas que rotan
            const numSpokes = 6;
            for (let spoke = 0; spoke < numSpokes; spoke++) {
                const angle = (spoke * Math.PI * 2 / numSpokes) + (phase * 0.03);
                const armWidth = Math.PI * 2 / numSpokes * 0.5;

                for (let angle2 = angle - armWidth / 2; angle2 < angle + armWidth / 2; angle2 += 0.1) {
                    const x = centerX + Math.cos(angle2) * radius;
                    const y = centerY + Math.sin(angle2) * radius;

                    ctx.fillStyle = 'rgb(255, 40, 0)';
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.strokeStyle = 'rgba(255, 40, 0, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawSpiral(ctx, sector, phase) {
            const centerX = ctx.canvas.width / 2;
            const centerY = ctx.canvas.height / 2;
            const radius = Math.min(centerX, centerY) * 0.8;
            const ledsPerArc = Math.PI * 2 / NUM_LEDS;

            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

            for (let i = 0; i < NUM_LEDS; i++) {
                const spiralPhase = (i * POV_SECTORS / NUM_LEDS * 3 + phase) % POV_SECTORS;
                const isSpiral = spiralPhase < (POV_SECTORS / 4);

                if (!isSpiral) continue;

                const angle = (i * ledsPerArc) + (phase * 0.01);
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;

                const colorShift = phase % 360;
                const r = 140 + Math.sin((spiralPhase + colorShift) * Math.PI / 128) * 30;
                const b = 255 + Math.cos((spiralPhase + colorShift) * Math.PI / 128) * 50;

                ctx.fillStyle = `rgb(${Math.round(r)}, 0, ${Math.round(b)})`;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.strokeStyle = 'rgba(140, 0, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function animate() {
            if (animationRunning) {
                animationPhase += speedMultiplier;
            }

            PATTERNS.forEach(pattern => {
                const canvas = document.getElementById(`canvas-${pattern.number}`);
                const ctx = canvas.getContext('2d');

                switch (pattern.number) {
                    case 0:
                        drawRainbow(ctx, 0, animationPhase);
                        break;
                    case 1:
                        drawRings(ctx, 0, animationPhase);
                        break;
                    case 2:
                        drawSpokes(ctx, 0, animationPhase);
                        break;
                    case 3:
                        drawSpiral(ctx, 0, animationPhase);
                        break;
                }
            });

            requestAnimationFrame(animate);
        }

        function toggleAnimation() {
            animationRunning = !animationRunning;
        }

        function resetAnimation() {
            animationPhase = 0;
        }

        function updateSpeed() {
            const slider = document.getElementById('speedSlider');
            speedMultiplier = parseFloat(slider.value);
            document.getElementById('speedValue').textContent = speedMultiplier.toFixed(1);
        }

        init();
    </script>
</body>
</html>
